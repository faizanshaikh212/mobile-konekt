<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MobileKonekt Admin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">HOST CONSOLE</p>
          <h1>MobileKonekt</h1>
        </div>
        <div class="header-actions">
          <button id="refresh">Refresh</button>
          <button id="reset">Reset all inputs</button>
        </div>
      </header>
      <section class="summary">
        <div><b id="count">0</b><span>connected devices</span></div>
        <div><b id="runtime">—</b><span>admin endpoint</span></div>
      </section>
      <section class="connection">
        <p class="eyebrow">PHONE CONNECTION</p>
        <h2 id="phone-url">Loading…</h2>
        <p>Open this address on phones connected to the same network.</p>
      </section>
      <section>
        <h2>Controllers</h2>
        <p class="meta">Phones and detected physical gamepads can share player numbers.</p>
        <div id="devices" class="grid"></div>
      </section>
      <section>
        <h2>Server & network</h2>
        <pre id="server">Loading…</pre>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
